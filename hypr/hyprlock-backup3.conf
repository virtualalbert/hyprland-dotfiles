# ~/.config/hypr/hyprlock.conf
#
# Palette matched to wallpaper.jpg — maroon accent, warm off-white text,
# instead of the earlier generic blue.

background {
    path = ~/Pictures/wallpaper.jpg
    blur_passes = 2
    blur_size = 4
}

# --- Clock, large text in the center-upper area ---
label {
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(232, 226, 216, 1.0)   # warm off-white, from the flowers
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# --- Date, smaller text just below the clock ---
label {
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(232, 226, 216, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
}

# --- Password input box ---
input-field {
    size = 250, 40
    position = 0,-350
    halign = center
    valign = center

    outline_thickness = 0.5
    dots_size = 0.3
    outer_color = white # deep maroon, from the door/window frames
    inner_color = rgba(38, 43, 40, 0.6)      # matches waybar/wofi dark base
    font_color = rgba(232, 226, 216, 1.0)

    placeholder_text = ...-- ...-- ----- .----
    fade_on_empty = true
}
env = SAL_USE_VCLPLUGIN,gtk3
